<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="./src/output.css">
    <title>Kanban Board | Task Manager</title>
</head>

<body class="bg-gray-100">
    <nav class="grid-blue h-15">
        <div class="container flex flex-wrap justify-between p-3 pb-3">
            <div class="left-nav flex flex-wrap">
                <i class="fa-solid fa-table-columns text-white text-2xl self-center me-2.5"></i>
                <h1 class=" text-xl font-bold text-white self-center">Kanban</h1>
            </div>
            <div class="right-nav">
                <div id="plusButton"
                    class="plus-icon cursor-pointer py-2 px-2.5 bg-purple-500 rounded-md transition hover:bg-purple-600">
                    <i class="fa-solid fa-plus text-white"></i>
                </div>
            </div>
        </div>
    </nav>
    <main>
        <div class="container my-10">
            <div class="flex gap-6">
                <div class="">
                    <div class="bg-card p-5 rounded-2xl h-full">
                        <div class="first flex mb-5">
                            <div class="icon bg-gray-500/5 p-2 rounded-xl">
                                <i class="fa-solid fa-clipboard-list opacity-60 text-lg"></i>
                            </div>
                            <div class="todo ms-2">
                                <h2 class="font-bold opacity-75">To Do</h2>
                                <p class="text-xs opacity-50">To do tasks</p>
                            </div>
                        </div>
                        <div class="space-y-3" id="todoColumn"></div>
                    </div>
                </div>

                <div>
                    <div class="bg-card p-5 rounded-2xl h-full">
                        <div class="first flex mb-5">
                            <div class="icon bg-amber-500/8 p-2 rounded-xl">
                                <i class="fa-solid fa-spinner opacity-60 text-lg text-amber-500"></i>
                            </div>
                            <div class="todo ms-2">
                                <h2 class="font-bold opacity-75">In Progress</h2>
                                <p class="text-xs opacity-50">Active tasks</p>
                            </div>
                        </div>
                        <div id="inProgressColumn" class="space-y-3"></div>
                    </div>
                </div>

                <div>
                    <div class="bg-card p-5 rounded-2xl h-full">
                        <div class="first flex mb-5">
                            <div class="icon bg-green-500/5 p-2 rounded-xl">
                                <i class="fa-solid fa-circle-check opacity-60 text-lg text-green-700"></i>
                            </div>
                            <div class="todo ms-2">
                                <h2 class="font-bold opacity-75">Completed</h2>
                                <p class="text-xs opacity-50">Finished tasks</p>
                            </div>
                        </div>
                        <div id="completedColumn" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="taskModal" class="hidden fixed inset-0 z-50 items-center justify-center flex bg-black/40 px-4 py-6">
        <div class="relative w-full max-w-2xl rounded-[30px] bg-white p-6 shadow-[0_35px_50px_-25px_rgba(0,0,0,0.35)]">
            <div class="flex items-center justify-between border-b border-gray-200 pb-4">
                <h2 class="text-xl font-semibold text-slate-900">Create New Task</h2>
                <button id="closeModal" type="button"
                    class="rounded-full p-2 text-slate-500 transition hover:bg-slate-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="taskForm" class="mt-5 space-y-4">
                <div>
                    <label class="mb-2 block text-sm font-medium text-slate-700">Task Title <span
                            class="text-red-500">*</span></label>
                    <input id="titleTask" type="text" name="title" placeholder="What needs to be done?"
                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition hover:border-slate-300 focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
                        required>
                </div>
                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-700">Priority</label>
                        <select id="priorityTask" name="priority"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
                            <option>Medium</option>
                            <option>High</option>
                            <option>Low</option>
                        </select>
                    </div>
                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-700">Due Date</label>
                        <input id="dueDateTask" type="date" name="dueDate"
                            class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100">
                    </div>
                </div>
                <div>
                    <label class="mb-2 block text-sm font-medium text-slate-700">Description</label>
                    <textarea id="descriptionTask" name="description" rows="4"
                        placeholder="Add more details about this task..."
                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100"></textarea>
                </div>
                <div class="flex items-center justify-end gap-3 pt-2">
                    <button id="cancelModal" type="button"
                        class="rounded-2xl border border-slate-200 bg-slate-100 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-200">Cancel</button>
                    <button id="addlModal" type="button"
                        class="rounded-2xl bg-violet-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-violet-700">Save
                        Task</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-blue-950  text-white absolute bottom-0 left-0 right-0">
        <div class="footer text-center py-6">
            <p class="text-sm opacity-70">Made with <span><i class="fa-solid fa-heart"
                        style="color: rgb(245, 11, 11);"></i></span>
                by Route Academy</p>
        </div>
    </footer>
    <script src="./index.js" defer></script>
</body>

</html>
